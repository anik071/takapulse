name: Build TakaPulse APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android scaffold without overwriting lib
        run: |
          flutter create . --platforms=android --project-name takapulse --org com.takapulse.app
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          printf '\nsubprojects {\n    tasks.matching { it.name.contains("lintVital") }.configureEach {\n        enabled = false\n    }\n}\n' >> android/build.gradle.kts

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Print Debug SHA-1 for Google Cloud Console
        run: |
          if [ -f ~/.android/debug.keystore ]; then
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          fi

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: takapulse-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: takapulse
description: Personal offline-first expense tracker with PDF export and Google Drive backup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  intl: ^0.20.2
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  pdf: ^3.11.2
  share_plus: ^10.1.4
  workmanager: ^0.10.10
  google_sign_in: ^6.3.0
  googleapis: ^13.2.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true